name: Lint & Type Check
on: [push, pull_request]

permissions:
  contents: write  # Required to allow GitHub Actions to commit and push changes

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }

      - run: pip install ruff mypy pydantic-settings

      # 1. Automatically remove unused imports, sort imports, and format code
      - run: ruff check --fix --select F401,E203 src/ tests/
      - run: ruff format --line-length=100 src/ tests/

      # 2. Automatically push the fixed files back to your branch
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix unused imports and format code with Ruff"

      # 3. Run remaining static type checks
      - run: mypy src/
